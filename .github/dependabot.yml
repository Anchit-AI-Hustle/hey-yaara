version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    # One PR for all minor and patch bumps: separate PRs each rewrite
    # package-lock.json, and merging several in a row left it out of sync
    # with package.json (npm ci failed after #46-#50).
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    # Major versions are done by hand, never by Dependabot. Merged one at a
    # time they broke npm ci or the build again and again (#37-#41, #57-#61,
    # #65-#69: eslint 10, vitest 5, lucide 1, tailwind 4, recharts 3...) and
    # each time no Android or iPhone app was built until someone noticed.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
