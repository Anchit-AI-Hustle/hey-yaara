name: CI
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaara_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: API tests on Postgres
        run: npm run test:api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yaara_test
      - run: npm run build
      - name: Browser tests (sign up, sign in, calls, reviews)
        run: |
          npx playwright install --with-deps chromium
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database yaara_e2e"
          npm run test:e2e
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yaara_e2e
